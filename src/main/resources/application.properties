spring.application.name=linkai

# Conexão com o Postgres dentro do Docker
spring.datasource.url=jdbc:postgresql://postgres:5432/linkai_db
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=linkai
spring.datasource.password=secret

# JPA
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Token JWT ou segurança
api.security.token.secret=my-secret-key
